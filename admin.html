<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Aksara Jawa Pro</title>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f3ee;
            color: #29231f;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2, h3 {
            color: #6D4528;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd4ca;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
        }
        button {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1b5e20;
        }
        hr {
            border: 0;
            border-top: 1px solid #ddd4ca;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Panel Aksara Jawa Pro</h2>
    
    <div class="form-group checkbox-group">
        <input type="checkbox" id="cfgMaintenance">
        <label for="cfgMaintenance" style="margin-bottom:0; cursor:pointer;">Aktifkan Mode Pemeliharaan (Maintenance)</label>
    </div>

    <div class="form-group">
        <label>Pesan Maintenance</label>
        <textarea id="cfgMaintenanceMsg" placeholder="Aplikasi sedang dalam peningkatan sistem."></textarea>
    </div>

    <hr>

    <div class="form-group">
        <label>Version Code (Angka, misal: 2)</label>
        <input type="text" id="cfgVersionCode">
    </div>

    <div class="form-group">
        <label>Versi Teks (misal: Versi 2.0.0)</label>
        <input type="text" id="cfgVersion">
    </div>

    <div class="form-group">
        <label>Link Download APK (Update)</label>
        <input type="text" id="cfgApkUrl" placeholder="https://play.google.com/store/apps/...">
    </div>

    <hr>

    <h3>Konten Informasi (About Us, Kontak & Alamat)</h3>

    <div class="form-group">
        <label>Tentang Aplikasi (About App)</label>
        <textarea id="cfgAbout"></textarea>
    </div>

    <div class="form-group">
        <label>Nama Developer / Pembuat</label>
        <input type="text" id="cfgDeveloper" placeholder="HomeDev / Hanacaraka">
    </div>

    <div class="form-group">
        <label>Alamat Lengkap</label>
        <input type="text" id="cfgContact" placeholder="Masukkan alamat lengkap Anda...">
    </div>

    <div class="form-group">
        <label>Kontak (Email atau No. WhatsApp)</label>
        <input type="text" id="cfgEmail" placeholder="klipsuren@gmail.com atau 628123456789">
    </div>

    <div class="form-group">
        <label>Link Privacy Policy</label>
        <input type="text" id="cfgPrivacy" placeholder="https://jagotheme.blogspot.com/">
    </div>

    <button id="btnSave">Simpan Semua Perubahan</button>
</div>

<script>
    // Konfigurasi Database Firebase Anda
    const firebaseConfig = {
        databaseURL: "https://aksara-jawapro-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 1. Muat data dari Firebase ke Admin Panel
    db.ref("AppConfig").once("value", snapshot => {
        const data = snapshot.val() || {};
        
        document.getElementById('cfgMaintenance').checked = (data.maintenance === "true");
        document.getElementById('cfgMaintenanceMsg').value = data.maintenance_msg || "";
        document.getElementById('cfgVersionCode').value = data.version_code || 1;
        document.getElementById('cfgVersion').value = data.version || "1.0.0";
        document.getElementById('cfgApkUrl').value = data.apk_url || "";
        
        // Konten Informasi & About Us
        document.getElementById('cfgAbout').value = data.desc_about || "";
        document.getElementById('cfgDeveloper').value = data.developer || "";
        document.getElementById('cfgContact').value = data.address || "";
        document.getElementById('cfgEmail').value = data.email || "";
        document.getElementById('cfgPrivacy').value = data.url_privacy || "";
    }, error => {
        alert("Gagal memuat data: " + error.message);
    });

    // 2. Simpan perubahan ke Firebase saat tombol diklik
    document.getElementById('btnSave').addEventListener('click', () => {
        const updatedData = {
            maintenance: document.getElementById('cfgMaintenance').checked ? "true" : "false",
            maintenance_msg: document.getElementById('cfgMaintenanceMsg').value,
            version_code: parseInt(document.getElementById('cfgVersionCode').value) || 1,
            version: document.getElementById('cfgVersion').value,
            apk_url: document.getElementById('cfgApkUrl').value,
            
            desc_about: document.getElementById('cfgAbout').value,
            developer: document.getElementById('cfgDeveloper').value,
            address: document.getElementById('cfgContact').value,
            email: document.getElementById('cfgEmail').value,
            url_privacy: document.getElementById('cfgPrivacy').value
        };

        db.ref("AppConfig").update(updatedData)
            .then(() => {
                alert("Data berhasil disimpan ke Firebase! Perubahan akan otomatis muncul di aplikasi.");
            })
            .catch(err => {
                alert("Gagal menyimpan: " + err.message);
            });
    });
</script>

</body>
</html>
</html>
