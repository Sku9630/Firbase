<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TTS Budaya Nusantara</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 550px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h3 { color: #8B0000; text-align: center; margin-top: 0; }
        h3 { border-bottom: 2px solid #f4f6f9; padding-bottom: 8px; margin-top: 25px; color: #333; text-align: left; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        button { width: 100%; padding: 12px; background: #8B0000; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button:hover { background: #500000; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Admin Panel TTS Budaya</h2>
    
    <!-- SEKSI UPDATE & ANNOUNCEMENT -->
    <h3>🚀 Update & Pengumuman</h3>
    <div class="form-group">
        <label>Version Code App:</label>
        <input type="text" id="versionCode" placeholder="2">
    </div>

    <div class="form-group">
        <label>URL Download APK Terbaru:</label>
        <input type="text" id="apkUrl" placeholder="https://...">
    </div>

    <div class="form-group">
        <label>Pesan Toast / Pengumuman:</label>
        <textarea id="toastMsg" placeholder="Ketik pesan untuk pemain..."></textarea>
    </div>

    <div class="form-group checkbox-group">
        <input type="checkbox" id="showToast">
        <label for="showToast" style="margin:0;">Aktifkan Pesan Toast di Aplikasi</label>
    </div>

    <!-- SEKSI TENTANG KAMI -->
    <h3>ℹ️ Pengaturan Halaman Tentang Kami</h3>
    <div class="form-group">
        <label>Teks Tentang Permainan (Deskripsi):</label>
        <textarea id="aboutText" placeholder="Ketik deskripsi permainan..."></textarea>
    </div>

    <div class="form-group">
        <label>Nama Developer:</label>
        <input type="text" id="devName" placeholder="HomeDev">
    </div>

    <div class="form-group">
        <label>Alamat Pengembang:</label>
        <textarea id="devAddress" placeholder="Masukkan alamat lengkap..."></textarea>
    </div>

    <div class="form-group">
        <label>Nama Tombol Website / Promo:</label>
        <input type="text" id="btn1Name" placeholder="Contoh: KUNJUNGI WEBSITE HOMEDEV">
    </div>

    <div class="form-group">
        <label>URL / Link Website Resmi:</label>
        <input type="text" id="btn1Url" placeholder="Contoh: https://sku9630.github.io/HomeDev">
    </div>

    <button onclick="simpanData()">Simpan & Broadcast Ke App</button>
    <div id="status"></div>
</div>

<script>
    // URL Database Firebase
    const FIREBASE_URL = "https://updateadmin-default-rtdb.asia-southeast1.firebasedatabase.app/.json";

    // 1. Load Data Otomatis Saat Web Dibuka
    window.onload = function() {
        document.getElementById('status').innerText = "Mengecek data Firebase...";
        fetch(FIREBASE_URL)
            .then(response => response.json())
            .then(data => {
                if(data) {
                    document.getElementById('versionCode').value = data.version_code || 1;
                    document.getElementById('apkUrl').value = data.apk_url || "";
                    document.getElementById('toastMsg').value = data.toast_message || "";
                    document.getElementById('showToast').checked = (data.show_toast === 1);
                    
                    // Load data Tentang Kami
                    document.getElementById('aboutText').value = data.about_text || "";
                    document.getElementById('devName').value = data.dev_name || "HomeDev";
                    document.getElementById('devAddress').value = data.dev_address || "Jln. Mlarak Pulung, Desa Suren, Kecamatan Mlarak, Kabupaten Ponorogo";
                    document.getElementById('btn1Name').value = data.btn1_name || "KUNJUNGI WEBSITE HOMEDEV";
                    document.getElementById('btn1Url').value = data.btn1_url || "https://sku9630.github.io/HomeDev";

                    document.getElementById('status').innerText = "Data berhasil dimuat!";
                    document.getElementById('status').style.color = "green";
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = "Gagal mengambil data dari Firebase";
                document.getElementById('status').style.color = "red";
            });
    };

    // 2. Simpan Data Baru ke Firebase
    function simpanData() {
        document.getElementById('status').innerText = "Menyimpan data...";
        
        const payload = {
            version_code: parseInt(document.getElementById('versionCode').value) || 1,
            apk_url: document.getElementById('apkUrl').value,
            toast_message: document.getElementById('toastMsg').value,
            show_toast: document.getElementById('showToast').checked ? 1 : 0,
            
            // Data Halaman Tentang Kami
            about_text: document.getElementById('aboutText').value,
            dev_name: document.getElementById('devName').value,
            dev_address: document.getElementById('devAddress').value,
            btn1_name: document.getElementById('btn1Name').value,
            btn1_url: document.getElementById('btn1Url').value
        };

        fetch(FIREBASE_URL, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('status').innerText = "✅ Berhasil Diperbarui Ke Aplikasi!";
            document.getElementById('status').style.color = "green";
        })
        .catch(err => {
            document.getElementById('status').innerText = "❌ Gagal Menyimpan!";
            document.getElementById('status').style.color = "red";
        });
    }
</script>

</body>
</html>
