<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Aksara Jawa Pro</title>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f6f3ee; color: #29231f; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2, h3 { color: #6D4528; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd4ca; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: 18px; height: 18px; }
        button { width: 100%; background-color: #2e7d32; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1b5e20; }
        hr { border: 0; border-top: 1px solid #ddd4ca; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Panel Aksara Jawa Pro</h2>
    
    <div class="form-group checkbox-group">
        <input type="checkbox" id="cfgMaintenance">
        <label for="cfgMaintenance" style="margin-bottom:0; cursor:pointer;">Aktifkan Mode Pemeliharaan (Maintenance)</label>
    </div>

    <div class="form-group">
        <label>Pesan Maintenance</label>
        <textarea id="cfgMaintenanceMsg"></textarea>
    </div>

    <hr>

    <h3>Pengaturan Pengumuman (Banner Atas)</h3>
    <div class="form-group">
        <label>Judul Pengumuman</label>
        <input type="text" id="cfgAnnounceTitle" placeholder="📢 Pengumuman Penting">
    </div>
    <div class="form-group">
        <label>Isi Pengumuman (Kosongkan untuk menyembunyikan)</label>
        <textarea id="cfgAnnounceText" placeholder="Tulis pengumuman di sini..."></textarea>
    </div>

    <hr>

    <h3>Konfigurasi Aplikasi</h3>
    <div class="form-group"><label>Version Code</label><input type="text" id="cfgVersionCode"></div>
    <div class="form-group"><label>Versi Teks</label><input type="text" id="cfgVersion"></div>
    <div class="form-group"><label>Link Download APK</label><input type="text" id="cfgApkUrl"></div>

    <hr>

    <h3>Konten Informasi</h3>
    <div class="form-group"><label>Tentang Aplikasi</label><textarea id="cfgAbout"></textarea></div>
    <div class="form-group"><label>Nama Developer</label><input type="text" id="cfgDeveloper"></div>
    <div class="form-group"><label>Alamat Lengkap</label><input type="text" id="cfgContact"></div>
    <div class="form-group"><label>Kontak (Email/WA)</label><input type="text" id="cfgEmail"></div>
    <div class="form-group"><label>Link Privacy Policy</label><input type="text" id="cfgPrivacy"></div>

    <button id="btnSave">Simpan Semua Perubahan</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://aksara-jawapro-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("AppConfig").once("value", snapshot => {
        const data = snapshot.val() || {};
        document.getElementById('cfgMaintenance').checked = (data.maintenance === "true");
        document.getElementById('cfgMaintenanceMsg').value = data.maintenance_msg || "";
        document.getElementById('cfgAnnounceTitle').value = data.announcement_title || "";
        document.getElementById('cfgAnnounceText').value = data.announcement_text || "";
        document.getElementById('cfgVersionCode').value = data.version_code || 1;
        document.getElementById('cfgVersion').value = data.version || "1.0.0";
        document.getElementById('cfgApkUrl').value = data.apk_url || "";
        document.getElementById('cfgAbout').value = data.desc_about || "";
        document.getElementById('cfgDeveloper').value = data.developer || "";
        document.getElementById('cfgContact').value = data.address || "";
        document.getElementById('cfgEmail').value = data.email || "";
        document.getElementById('cfgPrivacy').value = data.url_privacy || "";
    });

    document.getElementById('btnSave').addEventListener('click', () => {
        const updatedData = {
            maintenance: document.getElementById('cfgMaintenance').checked ? "true" : "false",
            maintenance_msg: document.getElementById('cfgMaintenanceMsg').value,
            announcement_title: document.getElementById('cfgAnnounceTitle').value,
            announcement_text: document.getElementById('cfgAnnounceText').value,
            version_code: parseInt(document.getElementById('cfgVersionCode').value) || 1,
            version: document.getElementById('cfgVersion').value,
            apk_url: document.getElementById('cfgApkUrl').value,
            desc_about: document.getElementById('cfgAbout').value,
            developer: document.getElementById('cfgDeveloper').value,
            address: document.getElementById('cfgContact').value,
            email: document.getElementById('cfgEmail').value,
            url_privacy: document.getElementById('cfgPrivacy').value
        };
        db.ref("AppConfig").update(updatedData)
            .then(() => alert("Data berhasil disimpan!"))
            .catch(err => alert("Gagal: " + err.message));
    });
</script>

</body>
    </html>
