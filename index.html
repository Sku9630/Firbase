<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - App Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- SECTION 1: FORM LOGIN -->
    <div id="loginSection" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-3">Admin Login</h3>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="admin@domain.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="******">
            </div>
            <button id="btnLogin" class="btn btn-primary w-100">Masuk</button>
            <div id="loginError" class="text-danger mt-2 text-center small"></div>
        </div>
    </div>

    <!-- SECTION 2: DASHBOARD UTAMA -->
    <div id="dashboardSection" class="container-fluid hidden">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="mb-4 text-warning">App Control</h4>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link active text-white">Konfigurasi App</a>
                    </li>
                </ul>
                <hr>
                <button id="btnLogout" class="btn btn-outline-danger w-100">Logout</button>
            </div>

            <!-- Content Area -->
            <div class="col-md-9 col-lg-10 p-4">
                <h2 class="mb-4">Pengaturan Aplikasi</h2>
                
                <div class="card shadow-sm p-4">
                    <form id="configForm">
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="cfgMaintenance">
                            <label class="form-check-label fw-bold" for="cfgMaintenance">Mode Maintenance</label>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Pesan Maintenance</label>
                            <input type="text" class="form-control" id="cfgMaintenanceMsg">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Version Code</label>
                                <input type="number" class="form-control" id="cfgVersionCode">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Versi Teks (misal: 1.0.0)</label>
                                <input type="text" class="form-control" id="cfgVersion">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL APK Terbaru</label>
                            <input type="url" class="form-control" id="cfgApkUrl">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Pesan Toast Konversi</label>
                            <input type="text" class="form-control" id="cfgMsgConvert">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Warna Akses Utama (Hex Code)</label>
                            <input type="color" class="form-control form-control-color" id="cfgColorAccent">
                        </div>

                        <button type="button" id="btnSave" class="btn btn-success">Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase App & Firebase Auth & Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- Custom Logic Script -->
    <script src="app.js"></script>
</body>
</html>
