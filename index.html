<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Aksara Jawa Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="mb-4 text-warning">Aksara Jawa Pro</h4>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item"><a href="#" class="nav-link active text-white">Dashboard Admin</a></li>
                </ul>
            </div>
            <div class="col-md-9 col-lg-10 p-4">
                <h2 class="mb-4">Pengaturan Aplikasi</h2>
                <div class="card shadow-sm p-4">
                    <form id="configForm">
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="cfgMaintenance">
                            <label class="form-check-label fw-bold" for="cfgMaintenance">Mode Maintenance</label>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Pesan Maintenance</label><input type="text" class="form-control" id="cfgMaintenanceMsg"></div>
                            <div class="col-md-6 mb-3"><label class="form-label">URL APK Terbaru</label><input type="url" class="form-control" id="cfgApkUrl"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Version Code</label><input type="number" class="form-control" id="cfgVersionCode"></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Versi Teks</label><input type="text" class="form-control" id="cfgVersion"></div>
                        </div>
                        <hr>
                        <h5>Konten Informasi</h5>
                        <div class="mb-3"><label class="form-label">About App</label><textarea class="form-control" id="cfgAbout" rows="3"></textarea></div>
                        <div class="mb-3"><label class="form-label">Contact Email/Info</label><input type="text" class="form-control" id="cfgContact"></div>
                        <div class="mb-3"><label class="form-label">Privacy Policy Link</label><input type="url" class="form-control" id="cfgPrivacy"></div>
                        <button type="button" id="btnSave" class="btn btn-success w-100">Simpan Semua Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
